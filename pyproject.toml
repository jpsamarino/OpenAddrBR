[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openaddrbr"
version = "1.0.0"
description = "Brazilian address geocoder using vector search (usearch) + SQLite (sgeobr.db)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "jpsamarino"}]
keywords = ["geocoding", "brazil", "ibge", "address", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "cachetools>=5.3",
    "usearch",
    "sentence-transformers",
    "numpy",
    "rapidfuzz",
    "huggingface_hub",
    "torch",
    "apsw",
    "optimum[onnxruntime]",
    "zstandard",
    "tantivy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "psutil",
]

[project.scripts]
openaddrbr = "openaddrbr.cli:_main"

# map package name to directory
[tool.setuptools.package-dir]
openaddrbr = "openaddrbr"

[tool.setuptools]
packages = [
    "openaddrbr",
    "openaddrbr.cli",
    "openaddrbr.core",
    "openaddrbr.core.models",
    "openaddrbr.core.interfaces",
    "openaddrbr.data",
    "openaddrbr.services",
    "openaddrbr.utils",
]

[tool.setuptools.package-data]
openaddrbr = ["data/*.json", "data/dbs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.format]
quote-style = "double"